<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="cursorClickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c89f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowClick">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
    <filter id="glowClick">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sombra Suave -->
  <ellipse cx="12" cy="28" rx="7" ry="2.5" fill="#1a3a52" opacity="0.2"/>
  
  <!-- Ponteiro Principal com Gradiente Invertido -->
  <path d="M 8 4 L 8 32 L 18 22 L 30 34 L 36 28 L 24 16 L 32 8 Z" 
        fill="url(#cursorClickGrad)" 
        stroke="#1a3a52" 
        stroke-width="1.5" 
        stroke-linejoin="round"
        filter="url(#shadowClick)"/>
  
  <!-- Detalhe Dourado - Ponta -->
  <circle cx="10" cy="6" r="3" fill="#e8c89f" opacity="1" filter="url(#glowClick)"/>
  
  <!-- Detalhe Azul Ciano - Meio -->
  <circle cx="14" cy="12" r="2.2" fill="#00d4ff" opacity="1" filter="url(#glowClick)"/>
  
  <!-- Detalhe Dourado - Base -->
  <circle cx="18" cy="20" r="1.8" fill="#e8c89f" opacity="0.9"/>
  
  <!-- Linhas de Energia -->
  <path d="M 10 6 L 14 10" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 14 12 L 18 18" stroke="#e8c89f" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Aura de Luz Expandida -->
  <circle cx="10" cy="6" r="4.5" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
  <circle cx="14" cy="12" r="3.5" fill="none" stroke="#e8c89f" stroke-width="0.8" opacity="0.3"/>
</svg>
