<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c89f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sombra Suave -->
  <ellipse cx="12" cy="28" rx="6" ry="2" fill="#1a3a52" opacity="0.15"/>
  
  <!-- Ponteiro Principal com Gradiente -->
  <path d="M 8 4 L 8 32 L 18 22 L 30 34 L 36 28 L 24 16 L 32 8 Z" 
        fill="url(#cursorGrad)" 
        stroke="#1a3a52" 
        stroke-width="1.5" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>
  
  <!-- Detalhe Azul Ciano - Ponta -->
  <circle cx="10" cy="6" r="2.5" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Detalhe Dourado - Meio -->
  <circle cx="14" cy="12" r="1.8" fill="#e8c89f" opacity="0.95" filter="url(#glow)"/>
  
  <!-- Detalhe Azul Ciano - Base -->
  <circle cx="18" cy="20" r="1.5" fill="#00d4ff" opacity="0.8"/>
  
  <!-- Brilho Adicional -->
  <path d="M 10 6 L 12 8" stroke="#00d4ff" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Aura de Luz -->
  <circle cx="10" cy="6" r="3.5" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
</svg>
